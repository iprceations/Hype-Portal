  <!-- Dual Orbital Planetary Nodes -->
  <!-- Node 1 (Apex Left) -->
  <circle cx="63.5" cy="18" r="3.4" fill="#F97316" />
  <circle cx="63.5" cy="18" r="1.6" fill="#FFFFFF" />

  <!-- Node 2 (Apex Right) -->
  <circle cx="78" cy="27" r="3.4" fill="#F59E0B" />
  <circle cx="78" cy="27" r="1.6" fill="#FFFFFF" />

  <!-- Letter H Geometry -->
  <!-- Left Pillar -->
  <path d="M 28 44 H 38 V 76 H 28 Z" fill="currentColor" />
  <!-- Center Crossbar -->
  <path d="M 38 54 H 54 V 63 H 38 Z" fill="currentColor" />
  <!-- Bottom Right Pillar -->
